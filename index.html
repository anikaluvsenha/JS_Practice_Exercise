<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SAMPLE SW1</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";; rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>;

    <style>
    	* {
    		margin: 0;
    		padding: 0;
    		box-sizing: border-box;
    	}

    	.container{
    		margin: auto;
    		width: 50%;
    		border: 3px solid green;
    		padding: 10px;
    		text-align:center;
    	}

    	body{
    		background-color: antiquewhite;
    	}
    </style>


</head>
<body>

	<div class="container">
		
		<div class="col-md-12">
		<script>
			var weight = 1000; //given value for weight in grams

			document.write("<h2>Click the button</h2>" + "<kbd>" + weight + "g" + "</kbd>" + "<h2>Change the weight to different scale</h2>");
	    </script>

	    <p id="display"></p>

	    <br>

	    <button type="button" class="btn btn-primary" onclick="var weight= 1000; var kilo = 1000; document.getElementById('display').innerHTML='<kbd>'+ weight/kilo +'</kbd>';">Kilo
	    </button>

	    <button type="button" class="btn btn-warning" onclick="var weight= 1000; var mgram = 1000; document.getElementById('display').innerHTML='<kbd>'+ weight*mgram +'</kbd>';">milligrams
	    </button>

	    <a href="index.html"><button class="btn btn-success">Refresh</button></a>


	</div>

</body>
</html>
